<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>Cosmic Calculator</title>
    <style>
        :root{
          --void: #05061a;
          --deep-blue: #0a1030;
          --nebula-violet: #7b2ff7;
          --nebula-blue: #2f6bff;
          --cyan: #6ee7ff;
          --white: #f4f2ff;
          --glass: rgba(20, 22, 55, 0.45);
          --glass-hi: rgba(40, 35, 90, 0.55);
          --border-glow: rgba(140, 130, 255, 0.35);
          --key-glow: rgba(110, 231, 255, 0.35);
          --op-a: #7b2ff7;
          --op-b: #2f6bff;
          --font-display: 'Courier New', ui-monospace, monospace;
          --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        @media (prefers-reduced-motion: reduce){
          *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
        }

        html, body{
          margin:0;
          min-height:100vh;
          background: radial-gradient(ellipse at 50% -10%, #151a44 0%, var(--void) 55%, #020208 100%);
          overflow-x: hidden;
          font-family: var(--font-body);
        }

        #stars{
          position: fixed;
          inset: 0;
          z-index: 0;
          opacity: 0;
          animation: starsFadeIn 2.2s ease forwards 0.2s;
        }
        @keyframes starsFadeIn{ to{ opacity: 1; } }

        /* ---------- Nebula ---------- */
        .nebula{
          position: fixed;
          inset: 0;
          z-index: 1;
          pointer-events: none;
          filter: blur(60px);
          opacity: 0.55;
          mix-blend-mode: screen;
        }
        .nebula span{
          position: absolute;
          border-radius: 50%;
          opacity: 0.5;
        }
        .nebula span:nth-child(1){
          width: 46vw; height: 46vw;
          top: -10%; left: -10%;
          background: radial-gradient(circle, var(--nebula-violet), transparent 70%);
          animation: nebulaDrift1 26s ease-in-out infinite alternate;
        }
        .nebula span:nth-child(2){
          width: 40vw; height: 40vw;
          bottom: -15%; right: -10%;
          background: radial-gradient(circle, var(--nebula-blue), transparent 70%);
          animation: nebulaDrift2 32s ease-in-out infinite alternate;
        }
        .nebula span:nth-child(3){
          width: 30vw; height: 30vw;
          top: 30%; right: 20%;
          background: radial-gradient(circle, var(--cyan), transparent 72%);
          opacity: 0.28;
          animation: nebulaDrift3 20s ease-in-out infinite alternate;
        }
        @keyframes nebulaDrift1{ from{ transform: translate(0,0) scale(1);} to{ transform: translate(6vw, 8vh) scale(1.15);} }
        @keyframes nebulaDrift2{ from{ transform: translate(0,0) scale(1);} to{ transform: translate(-7vw, -6vh) scale(1.1);} }
        @keyframes nebulaDrift3{ from{ transform: translate(0,0) scale(1);} to{ transform: translate(-4vw, 5vh) scale(1.2);} }

        /* ---------- Planets ---------- */
        .planets{
          position: fixed;
          inset: 0;
          z-index: 1;
          pointer-events: none;
          overflow: hidden;
        }
        .planet{
          position: absolute;
          border-radius: 50%;
          box-shadow: inset -8px -8px 20px rgba(0,0,0,0.5), 0 0 30px rgba(120,110,255,0.25);
        }
        .planet.p1{
          width: 90px; height: 90px;
          top: 12%; left: 8%;
          background: radial-gradient(circle at 35% 30%, #b39cff, #5a3fb8 55%, #241a55 100%);
          animation: orbitFloat1 22s ease-in-out infinite;
        }
        .planet.p1::after{
          content:"";
          position:absolute;
          top:50%; left:-25%;
          width:150%; height:14px;
          border-radius: 50%;
          border: 2px solid rgba(200,190,255,0.35);
          transform: translateY(-50%) rotate(-18deg);
        }
        .planet.p2{
          width: 46px; height: 46px;
          bottom: 16%; right: 10%;
          background: radial-gradient(circle at 35% 30%, #8fd8ff, #2a6fd6 55%, #123166 100%);
          animation: orbitFloat2 28s ease-in-out infinite;
        }
        .planet.p3{
          width: 22px; height: 22px;
          top: 62%; left: 18%;
          background: radial-gradient(circle at 35% 30%, #ffd9f2, #c968b0 55%, #5c245a 100%);
          animation: orbitFloat3 18s ease-in-out infinite;
        }
        @keyframes orbitFloat1{ 0%,100%{ transform: translate(0,0) rotate(0deg);} 50%{ transform: translate(14px,-18px) rotate(6deg);} }
        @keyframes orbitFloat2{ 0%,100%{ transform: translate(0,0);} 50%{ transform: translate(-16px,14px);} }
        @keyframes orbitFloat3{ 0%,100%{ transform: translate(0,0);} 50%{ transform: translate(10px,10px);} }

        .shooting-star{
          position: fixed;
          z-index: 2;
          width: 2px; height: 2px;
          background: white;
          border-radius: 50%;
          box-shadow: 0 0 6px 1px #fff, 0 0 12px 2px var(--cyan);
          pointer-events: none;
        }
        @keyframes shoot{
          0%   { transform: translate(0,0) scale(1); opacity: 1; }
          80%  { opacity: 1; }
          100% { transform: translate(var(--dx), var(--dy)) scale(0.3); opacity: 0; }
        }

        /* ---------- Layout ---------- */
        .stage{
          position: relative;
          z-index: 5;
          min-height: 100vh;
          display:flex;
          align-items:center;
          justify-content:center;
          padding: 28px 16px;
        }

        .app-wrap{
          opacity: 0;
          transform: translateY(24px) scale(0.97);
          animation: riseIn 0.8s cubic-bezier(.2,.9,.25,1) forwards 0.35s;
        }
        @keyframes riseIn{ to{ opacity: 1; transform: translateY(0) scale(1); } }

        .calculator{
          width: min(94vw, 380px);
          background: linear-gradient(165deg, var(--glass-hi), var(--glass));
          backdrop-filter: blur(18px);
          border: 1px solid var(--border-glow);
          border-radius: 26px;
          padding: 18px 16px 20px;
          box-shadow:
            0 30px 70px -20px rgba(0,0,0,0.75),
            0 0 50px -10px rgba(123,47,247,0.25),
            0 1px 0 rgba(255,255,255,0.06) inset;
        }

        /* ---------- Header ---------- */
        .brand-row{
          display:flex;
          align-items:center;
          justify-content: space-between;
          padding: 2px 4px 12px;
        }
        .brand{
          font-family: var(--font-display);
          font-size: 12px;
          letter-spacing: 3px;
          text-transform: uppercase;
          background: linear-gradient(90deg, var(--cyan), #c9b6ff);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
        }
        .controls{
          display:flex;
          gap: 8px;
          align-items:center;
        }

        .pill-toggle{
          display:flex;
          background: rgba(255,255,255,0.06);
          border: 1px solid var(--border-glow);
          border-radius: 999px;
          padding: 2px;
          position: relative;
          cursor: pointer;
          font-family: var(--font-display);
          font-size: 10px;
          color: #b9b3e6;
        }
        .pill-toggle span{
          padding: 4px 8px;
          position: relative;
          z-index: 1;
          transition: color 0.25s ease;
        }
        .pill-toggle .thumb{
          position: absolute;
          top: 2px; bottom: 2px; left: 2px;
          width: calc(50% - 2px);
          border-radius: 999px;
          background: linear-gradient(135deg, var(--op-a), var(--op-b));
          transition: transform 0.3s cubic-bezier(.4,1.6,.5,1);
          box-shadow: 0 0 10px rgba(123,47,247,0.6);
        }
        .pill-toggle.rad .thumb{ transform: translateX(100%); }
        .pill-toggle.rad span:first-child{ color: #8b84c2; }
        .pill-toggle.rad span:last-child{ color: #fff; }
        .pill-toggle:not(.rad) span:first-child{ color: #fff; }
        .pill-toggle:not(.rad) span:last-child{ color: #8b84c2; }

        .icon-btn{
          width: 30px; height: 30px;
          border-radius: 50%;
          background: rgba(255,255,255,0.06);
          border: 1px solid var(--border-glow);
          color: #cfc9ff;
          display:flex; align-items:center; justify-content:center;
          cursor: pointer;
          font-size: 13px;
          transition: filter 0.2s ease, transform 0.15s ease;
        }
        .icon-btn:active{ transform: scale(0.9); }
        .icon-btn.muted{ opacity: 0.4; }

        /* ---------- Screen ---------- */
        @keyframes screenFlicker{
          0%{opacity:.15;} 8%{opacity:.8;} 14%{opacity:.25;} 22%{opacity:1;} 100%{opacity:1;}
        }
        @keyframes screenGlow{
          0%,100%{ box-shadow: 0 3px 14px rgba(0,0,0,0.6) inset, 0 0 16px rgba(110,231,255,0.12);}
          50%{ box-shadow: 0 3px 14px rgba(0,0,0,0.6) inset, 0 0 26px rgba(123,47,247,0.28);}
        }
        .screen{
          background: linear-gradient(160deg, #0a0e2a, #060815);
          border: 1px solid rgba(140,130,255,0.25);
          border-radius: 14px;
          padding: 16px 14px 12px;
          margin-bottom: 14px;
          position: relative;
          overflow: hidden;
          min-height: 78px;
          animation: screenFlicker 0.8s steps(3,end) both, screenGlow 4.5s ease-in-out 0.8s infinite;
        }
        .screen::after{
          content:"";
          position:absolute; inset:0;
          background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
          pointer-events:none;
        }
        .screen-trace{
          min-height: 16px;
          font-family: var(--font-display);
          font-size: 12px;
          color: #6d78c9;
          letter-spacing: 0.5px;
          text-align: right;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
          margin-bottom: 6px;
        }
        @keyframes digitPop{
          0%{ opacity:.3; transform: translateY(3px); }
          100%{ opacity:1; transform: translateY(0); }
        }
        .screen-main{
          font-family: var(--font-display);
          font-size: 34px;
          line-height: 1.15;
          color: var(--white);
          text-align: right;
          letter-spacing: 1px;
          white-space: nowrap;
          overflow: hidden;
          background: linear-gradient(90deg, var(--cyan), #e6dcff 60%, #fff);
          -webkit-background-clip: text;
          background-clip: text;
          color: transparent;
          filter: drop-shadow(0 0 10px rgba(110,231,255,0.45));
          animation: digitPop 0.12s ease-out both;
          min-height: 40px;
        }
        .screen-main.error{
          background: linear-gradient(90deg, #ff8686, #ff4d6d);
          -webkit-background-clip: text; background-clip: text; color: transparent;
          filter: drop-shadow(0 0 10px rgba(255,90,110,0.5));
          animation: digitPop 0.12s ease-out both, shake 0.4s ease;
        }
        @keyframes shake{
          0%,100%{transform:translateX(0);} 20%{transform:translateX(-4px);} 40%{transform:translateX(4px);}
          60%{transform:translateX(-3px);} 80%{transform:translateX(3px);}
        }

        /* ---------- Sci panel toggle ---------- */
        .sci-toggle-row{
          display:flex;
          justify-content:center;
          margin-bottom: 10px;
        }
        .sci-toggle{
          font-family: var(--font-display);
          font-size: 10px;
          letter-spacing: 2px;
          color: #b9b3e6;
          background: rgba(255,255,255,0.05);
          border: 1px solid var(--border-glow);
          border-radius: 999px;
          padding: 5px 16px;
          cursor: pointer;
          display:flex;
          align-items:center;
          gap: 6px;
          transition: filter 0.2s ease;
        }
        .sci-toggle:active{ filter: brightness(1.3); }
        .sci-toggle .chev{
          display:inline-block;
          transition: transform 0.35s cubic-bezier(.4,1.4,.4,1);
        }
        .sci-toggle.open .chev{ transform: rotate(180deg); }

        .sci-panel{
          display:grid;
          grid-template-rows: 0fr;
          transition: grid-template-rows 0.4s cubic-bezier(.3,.9,.3,1);
          margin-bottom: 0;
        }
        .sci-panel.open{
          grid-template-rows: 1fr;
          margin-bottom: 10px;
        }
        .sci-panel-inner{
          overflow: hidden;
        }
        .sci-grid{
          display:grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 8px;
          padding-top: 2px;
        }

        /* ---------- Keys ---------- */
        .keys{
          display:grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 9px;
        }

        button{
          appearance:none;
          position: relative;
          overflow: hidden;
          border:none;
          cursor:pointer;
          font-family: var(--font-display);
          font-weight: bold;
          color: var(--white);
          background: rgba(255,255,255,0.06);
          border: 1px solid rgba(140,130,255,0.18);
          border-radius: 12px;
          transition: transform 0.04s ease, box-shadow 0.15s ease, filter 0.15s ease, background 0.2s ease;
          box-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 0 0 rgba(110,231,255,0);
        }
        button::after{
          content:"";
          position:absolute; inset:0;
          border-radius: inherit;
          background: radial-gradient(circle, rgba(110,231,255,0.65) 0%, transparent 62%);
          opacity: 0;
          transform: scale(0.4);
          transition: opacity 0.4s ease, transform 0.4s ease;
          pointer-events:none;
        }
        button:active::after{ opacity: 0.55; transform: scale(1.5); transition: opacity 0s, transform 0s; }
        button:hover{ filter: brightness(1.18); box-shadow: 0 2px 0 rgba(0,0,0,0.35), 0 0 14px rgba(110,231,255,0.25); }
        button:active{ transform: translateY(2px); box-shadow: 0 0 0 rgba(0,0,0,0.35); }
        button:focus-visible{ outline: 2px solid var(--cyan); outline-offset: 2px; }

        .keys button{ height: 54px; font-size: 17px; }
        .sci-grid button{ height: 40px; font-size: 12.5px; letter-spacing: 0.3px; }

        .key-num{
          background: rgba(255,255,255,0.08);
          color: #e9e6ff;
        }
        .key-fn{
          background: rgba(120,110,255,0.14);
          color: #c9c2ff;
        }
        .key-op{
          background: linear-gradient(160deg, var(--op-a), var(--op-b));
          color: #fff;
          box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 12px rgba(123,47,247,0.35);
        }
        .key-op:hover{ box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 20px rgba(123,47,247,0.6); }

        @keyframes opGlow{
          0%,100%{ box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 12px rgba(123,47,247,0.35);}
          50%{ box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 24px rgba(110,231,255,0.75);}
        }
        .key-op.active{ outline: 2px solid rgba(255,255,255,0.55); animation: opGlow 1.3s ease-in-out infinite; }

        .key-eq{
          background: linear-gradient(160deg, var(--cyan), #4a6bff);
          color: #04061a;
          box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 16px rgba(110,231,255,0.5);
        }
        .key-eq:hover{ box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 26px rgba(110,231,255,0.8); }

        .key-shift{
          background: rgba(255,255,255,0.05);
          color: #9089c9;
        }
        .key-shift.on{
          background: linear-gradient(160deg, var(--nebula-violet), var(--nebula-blue));
          color: #fff;
          box-shadow: 0 0 14px rgba(123,47,247,0.6);
        }

        .span-2{ grid-column: span 2; }

        footer{
          text-align:center;
          font-family: var(--font-display);
          font-size: 9px;
          letter-spacing: 2px;
          color: #565a8c;
          margin-top: 14px;
        }

        @media (max-width: 400px){
          .keys button{ height: 48px; font-size: 15px; }
          .sci-grid button{ height: 36px; font-size: 11px; }
          .screen-main{ font-size: 28px; }
        }
    </style>
</head>
<body>

<canvas id="stars"></canvas>
<div class="nebula"><span></span><span></span><span></span></div>
<div class="planets">
    <div class="planet p1"></div>
    <div class="planet p2"></div>
    <div class="planet p3"></div>
</div>

<div class="stage">
    <div class="app-wrap">
        <div class="calculator">

            <div class="brand-row">
                <div class="brand">Astra&nbsp;·&nbsp;SCI-9</div>
                <div class="controls">
                    <div class="pill-toggle" id="degRadToggle">
                        <span>DEG</span><span>RAD</span>
                        <div class="thumb"></div>
                    </div>
                    <button class="icon-btn" id="muteBtn" title="Toggle sound" aria-label="Toggle sound">♪</button>
                </div>
            </div>

            <div class="screen">
                <div class="screen-trace" id="trace">&nbsp;</div>
                <div class="screen-main" id="display">0</div>
            </div>

            <div class="sci-toggle-row">
                <button class="sci-toggle" id="sciToggle" type="button">
                    <span>SCIENTIFIC</span><span class="chev">⌄</span>
                </button>
            </div>

            <div class="sci-panel" id="sciPanel">
                <div class="sci-panel-inner">
                    <div class="sci-grid">
                        <button class="key-shift" id="shiftBtn" type="button">2nd</button>
                        <button class="key-fn" data-trig="sin" data-alt="asin">sin</button>
                        <button class="key-fn" data-trig="cos" data-alt="acos">cos</button>
                        <button class="key-fn" data-trig="tan" data-alt="atan">tan</button>
                        <button class="key-fn" data-insert="π">π</button>

                        <button class="key-fn" data-pow="^2" data-alt-pow="^3" data-label="x²" data-alt-label="x³">x²</button>
                        <button class="key-fn" data-root="√(" data-alt-root="∛(" data-label="√" data-alt-label="∛">√</button>
                        <button class="key-fn" data-insert="^">x^y</button>
                        <button class="key-fn" data-log="log" data-alt="10^">log</button>
                        <button class="key-fn" data-insert="e">e</button>

                        <button class="key-fn" data-insert="(">(</button>
                        <button class="key-fn" data-insert=")">)</button>
                        <button class="key-fn" data-ln="ln" data-alt="e^">ln</button>
                        <button class="key-fn" data-insert="!">n!</button>
                        <button class="key-fn" data-insert="Ans">Ans</button>
                    </div>
                </div>
            </div>

            <div class="keys">
                <button class="key-num" data-action="clear">AC</button>
                <button class="key-num" data-action="back">⌫</button>
                <button class="key-num" data-insert="%">%</button>
                <button class="key-op" data-op="÷">÷</button>

                <button class="key-num" data-num="7">7</button>
                <button class="key-num" data-num="8">8</button>
                <button class="key-num" data-num="9">9</button>
                <button class="key-op" data-op="×">×</button>

                <button class="key-num" data-num="4">4</button>
                <button class="key-num" data-num="5">5</button>
                <button class="key-num" data-num="6">6</button>
                <button class="key-op" data-op="-">−</button>

                <button class="key-num" data-num="1">1</button>
                <button class="key-num" data-num="2">2</button>
                <button class="key-num" data-num="3">3</button>
                <button class="key-op" data-op="+">+</button>

                <button class="key-num" data-action="negate">±</button>
                <button class="key-num" data-num="0">0</button>
                <button class="key-num" data-insert=".">.</button>
                <button class="key-eq" data-action="equals">=</button>
            </div>

            <footer>TRANSMITTING FROM ORBIT</footer>
        </div>
    </div>
</div>

<script>
    /* ============ STARFIELD ============ */
    (function(){
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      let w, h, stars = [];

      function resize(){
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
        const count = Math.floor((w*h)/6000);
        stars = Array.from({length: count}, () => ({
          x: Math.random()*w,
          y: Math.random()*h,
          r: Math.random()*1.4 + 0.3,
          baseAlpha: Math.random()*0.6 + 0.3,
          twinkleSpeed: Math.random()*0.02 + 0.005,
          phase: Math.random()*Math.PI*2,
          drift: Math.random()*0.06 + 0.02,
          hue: Math.random() < 0.15 ? 'violet' : (Math.random() < 0.3 ? 'cyan' : 'white')
        }));
      }

      function colorFor(hue, alpha){
        if(hue === 'violet') return `rgba(190,170,255,${alpha})`;
        if(hue === 'cyan') return `rgba(150,230,255,${alpha})`;
        return `rgba(255,255,255,${alpha})`;
      }

      let t = 0;
      function tick(){
        t += 1;
        ctx.clearRect(0,0,w,h);
        for(const s of stars){
          s.phase += s.twinkleSpeed;
          s.y += s.drift;
          if(s.y > h) s.y = 0;
          const alpha = s.baseAlpha * (0.55 + 0.45*Math.sin(s.phase));
          ctx.beginPath();
          ctx.fillStyle = colorFor(s.hue, alpha);
          ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }

      window.addEventListener('resize', resize);
      resize();
      tick();

      // Occasional shooting stars
      function spawnShootingStar(){
        const el = document.createElement('div');
        el.className = 'shooting-star';
        const startX = Math.random()*window.innerWidth*0.6 + window.innerWidth*0.1;
        const startY = Math.random()*window.innerHeight*0.3;
        const dx = 220 + Math.random()*160;
        const dy = 120 + Math.random()*100;
        el.style.left = startX+'px';
        el.style.top = startY+'px';
        el.style.setProperty('--dx', dx+'px');
        el.style.setProperty('--dy', dy+'px');
        el.style.animation = 'shoot 1.1s ease-out forwards';
        document.body.appendChild(el);
        setTimeout(()=>el.remove(), 1200);
        setTimeout(spawnShootingStar, 4000 + Math.random()*6000);
      }
      setTimeout(spawnShootingStar, 2500);
    })();

    /* ============ SOUND ============ */
    const Sound = (function(){
      let ctx = null;
      let muted = false;

      function ensureCtx(){
        if(!ctx){
          ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if(ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function tone(freq, duration, type, gainPeak, delay){
        if(muted) return;
        const ac = ensureCtx();
        const osc = ac.createOscillator();
        const gain = ac.createGain();
        osc.type = type || 'sine';
        osc.frequency.value = freq;
        const start = ac.currentTime + (delay || 0);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(gainPeak || 0.08, start + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + duration);
        osc.connect(gain);
        gain.connect(ac.destination);
        osc.start(start);
        osc.stop(start + duration + 0.02);
      }

      return {
        digit(){ tone(720 + Math.random()*40, 0.07, 'sine', 0.06); },
        fn(){ tone(500, 0.09, 'triangle', 0.06); },
        op(){ tone(360, 0.1, 'sawtooth', 0.045); },
        equals(){ tone(523.25, 0.1, 'sine', 0.07); tone(783.99, 0.16, 'sine', 0.07, 0.09); },
        clear(){ tone(220, 0.18, 'sawtooth', 0.05); tone(140, 0.2, 'sawtooth', 0.04, 0.05); },
        error(){ tone(180, 0.22, 'square', 0.05); tone(120, 0.28, 'square', 0.05, 0.08); },
        toggleMute(v){ muted = v; },
        isMuted(){ return muted; }
      };
    })();

    document.getElementById('muteBtn').addEventListener('click', (e)=>{
      const nowMuted = !Sound.isMuted();
      Sound.toggleMute(nowMuted);
      e.currentTarget.classList.toggle('muted', nowMuted);
      e.currentTarget.textContent = nowMuted ? '✕' : '♪';
    });

    /* ============ DEG/RAD + SCI panel + SHIFT ============ */
    let angleMode = 'DEG';
    const degRadToggle = document.getElementById('degRadToggle');
    degRadToggle.addEventListener('click', ()=>{
      angleMode = angleMode === 'DEG' ? 'RAD' : 'DEG';
      degRadToggle.classList.toggle('rad', angleMode === 'RAD');
      Sound.fn();
    });

    const sciToggle = document.getElementById('sciToggle');
    const sciPanel = document.getElementById('sciPanel');
    sciToggle.addEventListener('click', ()=>{
      const open = sciPanel.classList.toggle('open');
      sciToggle.classList.toggle('open', open);
      Sound.fn();
    });

    let shiftOn = false;
    const shiftBtn = document.getElementById('shiftBtn');
    shiftBtn.addEventListener('click', ()=>{
      shiftOn = !shiftOn;
      shiftBtn.classList.toggle('on', shiftOn);
      document.querySelectorAll('[data-trig]').forEach(b=>{
        b.textContent = shiftOn ? b.dataset.alt : b.dataset.trig;
      });
      document.querySelectorAll('[data-pow]').forEach(b=>{
        b.textContent = shiftOn ? b.dataset.altLabel : b.dataset.label;
      });
      document.querySelectorAll('[data-root]').forEach(b=>{
        b.textContent = shiftOn ? b.dataset.altLabel : b.dataset.label;
      });
      document.querySelectorAll('[data-log]').forEach(b=>{
        b.textContent = shiftOn ? b.dataset.alt : b.dataset.log;
      });
      document.querySelectorAll('[data-ln]').forEach(b=>{
        b.textContent = shiftOn ? b.dataset.alt : b.dataset.ln;
      });
      Sound.fn();
    });

    /* ============ CALCULATOR ENGINE ============ */
    const display = document.getElementById('display');
    const trace = document.getElementById('trace');

    let expr = '';
    let justEvaluated = false;
    let lastAnswer = 0;

    function render(showAsResult){
      display.classList.remove('error');
      const shown = expr === '' ? '0' : expr;
      display.textContent = shown;
      fitDisplay(shown.length);
      retrigger(display);
    }

    function fitDisplay(len){
      let size = 34;
      if(len > 11) size = 26;
      if(len > 15) size = 20;
      if(len > 20) size = 16;
      display.style.fontSize = size + 'px';
    }

    function retrigger(el){
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    }

    function showError(){
      display.textContent = 'Error';
      display.classList.add('error');
      retrigger(display);
      Sound.error();
      justEvaluated = true;
    }

    function insert(str){
      if(justEvaluated){
        if(/^[0-9.(]/.test(str) || /^(sin|cos|tan|asin|acos|atan|log|ln|sqrt|π|e|Ans)/.test(str)){
          expr = '';
        }
        justEvaluated = false;
      }
      if(expr === '0') expr = '';
      expr += str;
      trace.textContent = '\u00a0';
      render();
    }

    function insertOperator(op){
      if(justEvaluated){ justEvaluated = false; }
      if(expr === '') expr = String(formatNum(lastAnswer));
      // replace trailing operator if user changes their mind
      if(/[+\-×÷^]$/.test(expr)){
        expr = expr.slice(0, -1) + op;
      } else {
        expr += op;
      }
      render();
    }

    function backspace(){
      if(justEvaluated){ expr = ''; justEvaluated = false; render(); return; }
      expr = expr.slice(0, -1);
      render();
    }

    function clearAll(){
      expr = '';
      justEvaluated = false;
      trace.textContent = '\u00a0';
      render();
      Sound.clear();
    }

    function negate(){
      if(expr === '' || expr === '0'){ return; }
      // Wrap whole expression in a leading negation toggle if simple, else prepend -(
      if(expr.startsWith('-(') && expr.endsWith(')')){
        expr = expr.slice(2, -1);
      } else if(/^-?\d+(\.\d+)?$/.test(expr)){
        expr = expr.startsWith('-') ? expr.slice(1) : '-' + expr;
      } else {
        expr = '-(' + expr + ')';
      }
      render();
    }

    function formatNum(n){
      if(!isFinite(n)) return 'Error';
      if(Number.isNaN(n)) return 'Error';
      const rounded = Math.round(n * 1e10) / 1e10;
      if(Math.abs(rounded) >= 1e12 || (Math.abs(rounded) < 1e-9 && rounded !== 0)){
        return rounded.toExponential(6).replace(/e\+?/, 'e');
      }
      return String(rounded);
    }

    /* ---- Tokenizer ---- */
    function tokenize(str){
      const tokens = [];
      let i = 0;
      const funcWords = ['asin','acos','atan','sin','cos','tan','sqrt','log','ln'];
      while(i < str.length){
        const c = str[i];
        if(c === ' '){ i++; continue; }
        if(/[0-9.]/.test(c)){
          let j = i;
          while(j < str.length && /[0-9.]/.test(str[j])) j++;
          tokens.push({type:'num', value: parseFloat(str.slice(i,j))});
          i = j;
          continue;
        }
        let matchedWord = null;
        for(const w of funcWords){
          if(str.startsWith(w, i)){ matchedWord = w; break; }
        }
        if(matchedWord){
          tokens.push({type:'func', value: matchedWord});
          i += matchedWord.length;
          continue;
        }
        if(str.startsWith('Ans', i)){ tokens.push({type:'ans'}); i += 3; continue; }
        if(c === '√'){ tokens.push({type:'func', value:'sqrt'}); i++; continue; }
        if(c === '∛'){ tokens.push({type:'func', value:'cbrt'}); i++; continue; }
        if(c === 'π'){ tokens.push({type:'num', value: Math.PI}); i++; continue; }
        if(c === 'e'){ tokens.push({type:'num', value: Math.E}); i++; continue; }
        if(c === '×'){ tokens.push({type:'op', value:'*'}); i++; continue; }
        if(c === '÷'){ tokens.push({type:'op', value:'/'}); i++; continue; }
        if(c === '−'){ tokens.push({type:'op', value:'-'}); i++; continue; }
        if('+-*/^!%()'.includes(c)){ tokens.push({type: (c==='('||c===')') ? 'paren' : (c==='!'||c==='%') ? 'postfix' : 'op', value: c}); i++; continue; }
        throw new Error('bad token: ' + c);
      }
      return tokens;
    }

    /* ---- Parser (recursive descent) ---- */
    function parseExpr(tokens){
      let pos = 0;
      function peek(){ return tokens[pos]; }
      function next(){ return tokens[pos++]; }

      function parseExpression(){
        let left = parseTerm();
        while(peek() && peek().type === 'op' && (peek().value === '+' || peek().value === '-')){
          const op = next().value;
          const right = parseTerm();
          left = op === '+' ? left + right : left - right;
        }
        return left;
      }
      function parseTerm(){
        let left = parseUnary();
        while(peek() && peek().type === 'op' && (peek().value === '*' || peek().value === '/')){
          const op = next().value;
          const right = parseUnary();
          if(op === '/'){
            left = left / right;
          } else {
            left = left * right;
          }
        }
        return left;
      }
      function parseUnary(){
        if(peek() && peek().type === 'op' && peek().value === '-'){
          next();
          return -parseUnary();
        }
        return parsePow();
      }
      function parsePow(){
        let left = parsePostfix();
        if(peek() && peek().type === 'op' && peek().value === '^'){
          next();
          const right = parseUnary();
          left = Math.pow(left, right);
        }
        return left;
      }
      function parsePostfix(){
        let val = parsePrimary();
        while(peek() && peek().type === 'postfix'){
          const p = next().value;
          if(p === '!') val = factorial(val);
          if(p === '%') val = val / 100;
        }
        return val;
      }
      function factorial(n){
        if(n < 0 || Math.floor(n) !== n) return NaN;
        if(n > 170) return Infinity;
        let r = 1;
        for(let k=2;k<=n;k++) r*=k;
        return r;
      }
      function applyTrig(fname, arg){
        const toRad = a => angleMode === 'DEG' ? a*Math.PI/180 : a;
        const toOut = a => angleMode === 'DEG' ? a*180/Math.PI : a;
        switch(fname){
          case 'sin': return Math.sin(toRad(arg));
          case 'cos': return Math.cos(toRad(arg));
          case 'tan': return Math.tan(toRad(arg));
          case 'asin': return toOut(Math.asin(arg));
          case 'acos': return toOut(Math.acos(arg));
          case 'atan': return toOut(Math.atan(arg));
          case 'ln': return Math.log(arg);
          case 'log': return Math.log10(arg);
          case 'sqrt': return Math.sqrt(arg);
          case 'cbrt': return Math.cbrt(arg);
          default: return NaN;
        }
      }
      function parsePrimary(){
        const t = peek();
        if(!t) throw new Error('unexpected end');
        if(t.type === 'num'){ next(); return t.value; }
        if(t.type === 'ans'){ next(); return lastAnswer; }
        if(t.type === 'func'){
          next();
          if(!(peek() && peek().type === 'paren' && peek().value === '(')) throw new Error('expected (');
          next();
          const arg = parseExpression();
          if(peek() && peek().type === 'paren' && peek().value === ')') next();
          return applyTrig(t.value, arg);
        }
        if(t.type === 'paren' && t.value === '('){
          next();
          const val = parseExpression();
          if(peek() && peek().type === 'paren' && peek().value === ')') next();
          return val;
        }
        if(t.type === 'op' && t.value === '-'){
          next();
          return -parsePrimary();
        }
        throw new Error('unexpected token');
      }

      const result = parseExpression();
      if(pos < tokens.length) throw new Error('trailing tokens');
      return result;
    }

    function autoCloseParens(str){
      let open = 0;
      for(const c of str){
        if(c === '(') open++;
        if(c === ')') open--;
      }
      return str + ')'.repeat(Math.max(0, open));
    }

    function evaluate(){
      if(expr === '' || expr === '0'){ return; }
      const source = autoCloseParens(expr);
      try{
        const tokens = tokenize(source);
        const result = parseExpr(tokens);
        if(!isFinite(result) || Number.isNaN(result)){
          showError();
          return;
        }
        trace.textContent = expr + ' =';
        lastAnswer = result;
        expr = formatNum(result);
        justEvaluated = true;
        render();
        Sound.equals();
      } catch(err){
        showError();
      }
    }

    /* ---- Button wiring ---- */
    document.querySelectorAll('[data-num]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ insert(btn.dataset.num); Sound.digit(); });
    });
    document.querySelectorAll('[data-insert]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ insert(btn.dataset.insert); Sound.fn(); });
    });
    document.querySelectorAll('[data-op]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        insertOperator(btn.dataset.op);
        document.querySelectorAll('[data-op]').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        setTimeout(()=>btn.classList.remove('active'), 700);
        Sound.op();
      });
    });
    document.querySelectorAll('[data-trig]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const name = shiftOn ? btn.dataset.alt : btn.dataset.trig;
        insert(name + '(');
        Sound.fn();
      });
    });
    document.querySelectorAll('[data-pow]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        insert(shiftOn ? btn.dataset.altPow : btn.dataset.pow);
        Sound.fn();
      });
    });
    document.querySelectorAll('[data-root]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        insert(shiftOn ? btn.dataset.altRoot : btn.dataset.root);
        Sound.fn();
      });
    });
    document.querySelectorAll('[data-log]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        insert(shiftOn ? btn.dataset.alt + '(' : btn.dataset.log + '(');
        Sound.fn();
      });
    });
    document.querySelectorAll('[data-ln]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        insert(shiftOn ? btn.dataset.alt + '(' : btn.dataset.ln + '(');
        Sound.fn();
      });
    });
    document.querySelector('[data-action="clear"]').addEventListener('click', clearAll);
    document.querySelector('[data-action="back"]').addEventListener('click', ()=>{ backspace(); Sound.digit(); });
    document.querySelector('[data-action="negate"]').addEventListener('click', ()=>{ negate(); Sound.digit(); });
    document.querySelector('[data-action="equals"]').addEventListener('click', evaluate);

    /* ---- Keyboard support ---- */
    window.addEventListener('keydown', (e)=>{
      if(e.key >= '0' && e.key <= '9'){ insert(e.key); Sound.digit(); }
      else if(e.key === '.'){ insert('.'); Sound.digit(); }
      else if(e.key === '+'){ insertOperator('+'); Sound.op(); }
      else if(e.key === '-'){ insertOperator('-'); Sound.op(); }
      else if(e.key === '*'){ insertOperator('×'); Sound.op(); }
      else if(e.key === '/'){ e.preventDefault(); insertOperator('÷'); Sound.op(); }
      else if(e.key === '^'){ insert('^'); Sound.op(); }
      else if(e.key === '('){ insert('('); Sound.fn(); }
      else if(e.key === ')'){ insert(')'); Sound.fn(); }
      else if(e.key === 'Enter' || e.key === '='){ e.preventDefault(); evaluate(); }
      else if(e.key === 'Backspace'){ backspace(); Sound.digit(); }
      else if(e.key === 'Escape'){ clearAll(); }
      else if(e.key === '%'){ insert('%'); Sound.fn(); }
    });

    render();
</script>

</body>
</html>
